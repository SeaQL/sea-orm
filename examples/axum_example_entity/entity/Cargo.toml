[package]
edition      = "2024"
name         = "entity"
publish      = false
rust-version = "1.85.0"
version      = "0.1.0"

[lib]
name = "entity"
path = "src/lib.rs"

[dependencies]
migration = { path = "../migration" }
sea-orm   = { path = "../../../", version = "~2.0.0-rc.37" }
tokio     = { version = "1", features = ["macros", "rt-multi-thread"] }
# entity = { path = "../entity" }

[dependencies.sea-orm-migration]
features = [
    "entity-first",
    "runtime-tokio-native-tls",
    # "sqlx-sqlite",
    "sqlx-postgres",
]
path = "../../../sea-orm-migration"
version = "~2.0.0-rc.37"
